name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Type check
        run: mypy

      - name: Secret scan
        run: python scripts/check_secrets.py

      - name: Unit tests
        run: pytest tests/unit -q

      - name: Architecture tests
        run: pytest tests/architecture -q

      - name: Contract tests
        run: pytest tests/contract -q

      - name: Integration tests
        run: pytest tests/integration -q

      - name: Property tests
        run: pytest tests/property -q

      - name: Regression tests
        run: pytest tests/regression -q

      - name: End-to-end tests
        run: pytest tests/e2e -q

      - name: Coverage
        run: |
          pytest --cov=creative_brain.domain --cov=creative_brain.application \
            --cov-report=term-missing:skip-covered --cov-fail-under=85
