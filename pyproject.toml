[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pedroarte-creative-brain"
version = "0.1.0"
description = "PEDRO_ARTE_DNA_MY_CREATIVE_BRAIN - an autonomous multi-agent creative operating system."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Pedro Arte Labs" }]
keywords = ["multi-agent", "creativity", "hexagonal-architecture", "autonomous-systems"]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.34"]
openai = ["openai>=1.40"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]

[project.scripts]
creative-brain = "creative_brain.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/creative_brain"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "D"]
ignore = [
  "D100", # module docstring not required everywhere (packages are documented in __init__)
  "D104",
  "D105", # magic methods are self-describing
  "D107", # dataclasses/pydantic models document at class level
  "D203",
  "D213",
  "RUF001", # ambiguous unicode in Portuguese creative corpus strings
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "N802"]
"scripts/*" = ["D"]

[tool.mypy]
python_version = "3.11"
packages = ["creative_brain"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["anthropic.*", "openai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "e2e: end-to-end creative cycle scenarios",
  "slow: longer running scenarios",
]

[tool.coverage.run]
source = ["src/creative_brain"]
branch = true
omit = [
  "src/creative_brain/adapters/llm/anthropic_adapter.py",
  "src/creative_brain/adapters/llm/openai_adapter.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]
